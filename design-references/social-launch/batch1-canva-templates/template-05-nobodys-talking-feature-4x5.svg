<text x="76" y="225" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900" fill="#607086" >NOBODY’S TALKING ABOUT</text>
<text x="76" y="400" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="130" font-weight="700" fill="#0D2540" >Conrad</text>
<rect x="70" y="520" width="940" height="500" rx="36" fill="#FFFFFF" stroke="rgba(13,37,64,0.12)"/>
<text x="120" y="610" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0D2540" >Established without feeling overexposed.</text>
<text x="120" y="700" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0D2540" >Strong, but not harsh.</text>
<text x="120" y="790" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0D2540" >Traditional, but not predictable.</text>
<text x="120" y="880" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0D2540" >Grounded, intelligent, quietly distinctive.</text>
<rect x="120" y="1085" width="210" height="62" rx="31.0" fill="#DDEBDD" stroke="#DDE3EC"/><text x="225.0" y="1124.75" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0D2540">classic</text><rect x="355" y="1085" width="245" height="62" rx="31.0" fill="#F7DAD6" stroke="#DDE3EC"/><text x="477.5" y="1124.75" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0D2540">substantial</text><rect x="625" y="1085" width="250" height="62" rx="31.0" fill="#FFFFFF" stroke="#DDE3EC"/><text x="750.0" y="1124.75" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#0D2540">less obvious</text>
<text x="76" y="1240" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800" fill="#0D2540" >Would you add Conrad to the list?</text>

