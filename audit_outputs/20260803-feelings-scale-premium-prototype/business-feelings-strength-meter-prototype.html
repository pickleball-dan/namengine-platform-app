<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NamEngine Business · Strength Meter Prototype</title>
  <style>
    :root {
      --ink: #111a2f;
      --muted: #647084;
      --page: #f2f8f7;
      --teal: #40aaa0;
      --teal-deep: #157a73;
      --gold: #d7a845;
      --line: rgba(17, 26, 47, 0.1);
      --serif: Georgia, 'Times New Roman', serif;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(circle at 18% -6%, rgba(215, 168, 69, 0.22), transparent 18rem),
        radial-gradient(circle at 100% 8%, rgba(64, 170, 160, 0.24), transparent 18rem),
        linear-gradient(180deg, #fbfdfd, var(--page));
    }

    main {
      width: min(100% - 18px, 430px);
      margin: 0 auto;
      padding: 14px 0 28px;
    }

    .phone-shell {
      padding: 11px;
      background: rgba(255, 255, 255, 0.44);
      border: 1px solid rgba(17, 26, 47, 0.08);
      border-radius: 32px;
      box-shadow: 0 30px 80px rgba(17, 26, 47, 0.16);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      margin: 7px 8px 8px;
      color: #4a596d;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 6px 18px;
      color: #101b31;
      font-family: var(--serif);
      font-size: clamp(48px, 15vw, 64px);
      font-weight: 500;
      line-height: 0.86;
      letter-spacing: -0.055em;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 13px;
      background:
        linear-gradient(#fff, #fff) padding-box,
        linear-gradient(135deg, rgba(64, 170, 160, 0.95), rgba(215, 168, 69, 0.7), rgba(17, 26, 47, 0.16)) border-box;
      border: 1px solid transparent;
      border-top-width: 4px;
      border-radius: 25px;
      box-shadow: 0 22px 52px rgba(17, 26, 47, 0.14);
    }

    .meter-board {
      display: grid;
      gap: 13px;
      padding: 16px;
      background:
        radial-gradient(circle at 85% 0%, rgba(64, 170, 160, 0.16), transparent 14rem),
        linear-gradient(135deg, rgba(247, 239, 224, 0.7), rgba(231, 245, 244, 0.88));
      border: 1px solid rgba(17, 26, 47, 0.09);
      border-radius: 22px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
    }

    .meter-card {
      position: relative;
      padding: 15px 14px 14px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(17, 26, 47, 0.08);
      border-radius: 18px;
      box-shadow: 0 15px 32px rgba(17, 26, 47, 0.07);
      backdrop-filter: blur(12px);
    }

    .meter-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }

    .meter-head strong {
      font-size: 14px;
      line-height: 1.15;
    }

    .meter-value {
      min-width: 48px;
      padding: 5px 9px;
      color: var(--teal-deep);
      font-size: 12px;
      font-weight: 950;
      text-align: center;
      background: rgba(64, 170, 160, 0.1);
      border: 1px solid rgba(64, 170, 160, 0.13);
      border-radius: 999px;
    }

    .taper-meter {
      position: relative;
      height: 34px;
      overflow: hidden;
      isolation: isolate;
      clip-path: polygon(0 40%, 100% 0, 100% 100%, 0 60%);
      background:
        linear-gradient(90deg, rgba(17, 26, 47, 0.075), rgba(17, 26, 47, 0.12));
      border-radius: 999px;
    }

    .taper-meter::before {
      content: '';
      position: absolute;
      inset: 1px;
      z-index: -1;
      clip-path: inherit;
      background-image:
        linear-gradient(90deg, rgba(255,255,255,0.2) 1px, transparent 1px);
      background-size: 24px 100%;
      opacity: 0.7;
    }

    .taper-fill {
      width: var(--value, 33%);
      height: 100%;
      clip-path: inherit;
      background:
        linear-gradient(90deg, var(--teal), color-mix(in srgb, var(--teal) 48%, var(--gold)), var(--gold));
      border-radius: inherit;
      box-shadow: 0 0 22px rgba(64, 170, 160, 0.28);
      transition: width 130ms ease;
    }

    .slider-wrap {
      position: relative;
      margin-top: 12px;
    }

    input[type='range'] {
      display: block;
      width: 100%;
      height: 36px;
      margin: 0;
      accent-color: var(--teal);
    }

    input[type='range']::-webkit-slider-thumb {
      width: 28px;
      height: 28px;
      cursor: pointer;
    }

    .scale-ends {
      display: flex;
      justify-content: space-between;
      margin-top: -2px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .button {
      width: 100%;
      margin-top: 13px;
      padding: 17px 20px;
      color: #fff;
      font: inherit;
      font-weight: 950;
      background: #111a2f;
      border: 0;
      border-radius: 16px;
      box-shadow: 0 14px 24px rgba(17, 26, 47, 0.18);
    }
  </style>
</head>
<body>
  <main>
    <div class="phone-shell">
      <p class="eyebrow">NamEngine Business</p>
      <h1>Feelings Scale</h1>

      <section class="card" aria-label="Strength meter prototype">
        <div class="meter-board">
          <label class="meter-card">
            <span class="meter-head"><strong>About the business</strong><span class="meter-value" data-value="about">34%</span></span>
            <span class="taper-meter" aria-hidden="true"><span class="taper-fill" data-fill="about"></span></span>
            <span class="slider-wrap"><input type="range" min="0" max="100" value="34" data-slider="about"></span>
            <span class="scale-ends"><span>Light</span><span>Strong</span></span>
          </label>

          <label class="meter-card">
            <span class="meter-head"><strong>Name style</strong><span class="meter-value" data-value="style">33%</span></span>
            <span class="taper-meter" aria-hidden="true"><span class="taper-fill" data-fill="style"></span></span>
            <span class="slider-wrap"><input type="range" min="0" max="100" value="33" data-slider="style"></span>
            <span class="scale-ends"><span>Light</span><span>Strong</span></span>
          </label>

          <label class="meter-card">
            <span class="meter-head"><strong>Launch fit</strong><span class="meter-value" data-value="launch">33%</span></span>
            <span class="taper-meter" aria-hidden="true"><span class="taper-fill" data-fill="launch"></span></span>
            <span class="slider-wrap"><input type="range" min="0" max="100" value="33" data-slider="launch"></span>
            <span class="scale-ends"><span>Light</span><span>Strong</span></span>
          </label>
        </div>

        <button class="button" type="button">Generate Business Names</button>
      </section>
    </div>
  </main>

  <script>
    const keys = ['about', 'style', 'launch'];

    function updateMeter(key) {
      const slider = document.querySelector(`[data-slider="${key}"]`);
      const value = document.querySelector(`[data-value="${key}"]`);
      const fill = document.querySelector(`[data-fill="${key}"]`);
      const amount = Number(slider.value);
      value.textContent = `${amount}%`;
      fill.style.setProperty('--value', `${amount}%`);
    }

    keys.forEach((key) => {
      const slider = document.querySelector(`[data-slider="${key}"]`);
      slider.addEventListener('input', () => updateMeter(key));
      updateMeter(key);
    });
  </script>
</body>
</html>
