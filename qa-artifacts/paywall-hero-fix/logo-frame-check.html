<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../static/css/platform.css">
<style>
  body { background: #0b1830; padding: 40px; display: flex; gap: 40px; align-items: flex-start; }
  .label { color: #94c0e4; font-family: sans-serif; font-size: 12px; font-weight: 700;
           text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
  .col { width: 280px; }
</style>
</head>
<body class="vertical-business">

  <!-- BEFORE mock (dark frame): manually recreate old style -->
  <div class="col">
    <p class="label">Before (dark frame — bug)</p>
    <figure style="display:grid;gap:10px;padding:14px 14px 10px;background:#0b1830;border:1px solid rgba(63,166,160,.28);border-radius:16px;">
      <!-- simulated dark logo image -->
      <div style="width:100%;aspect-ratio:1;border-radius:10px;background:#0e1c36;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;">
        <div style="font-size:48px;color:#0d2540;font-family:serif;font-weight:700;">♥</div>
        <div style="font-size:32px;color:#0d2540;font-family:Georgia,serif;font-weight:700;">Craftely</div>
      </div>
      <figcaption style="color:rgba(148,192,228,.55);font-size:10px;font-weight:700;letter-spacing:.12em;text-align:center;text-transform:uppercase;">Logo Concept</figcaption>
    </figure>
  </div>

  <!-- AFTER (white frame): uses updated CSS -->
  <div class="col">
    <p class="label">After (white frame — fixed)</p>
    <figure class="business-concept-frame">
      <!-- simulated dark logo image on white -->
      <div style="width:100%;aspect-ratio:1;border-radius:10px;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border:1px solid rgba(63,166,160,.18);">
        <div style="font-size:48px;color:#0d2540;font-family:serif;font-weight:700;">♥</div>
        <div style="font-size:32px;color:#0d2540;font-family:Georgia,serif;font-weight:700;">Craftely</div>
      </div>
      <figcaption>Logo Concept</figcaption>
    </figure>
  </div>

</body>
</html>
