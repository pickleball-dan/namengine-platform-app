<svg viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="780" fill="white"/>

  <!-- Outer system boundary -->
  <rect x="30" y="30" width="940" height="660" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="20" font-size="16" text-anchor="middle" font-weight="bold">FIG. 1</text>

  <!-- 100 label for overall system -->
  <text x="45" y="55" font-size="13" font-style="italic">100</text>

  <!-- Top row boxes -->
  <!-- 110 Intake Pipeline -->
  <rect x="60" y="80" width="260" height="150" fill="none" stroke="black" stroke-width="2"/>
  <text x="190" y="105" font-size="15" text-anchor="middle" font-weight="bold">INTAKE PIPELINE</text>
  <text x="190" y="122" font-size="13" text-anchor="middle" font-style="italic">110</text>
  <text x="80" y="148" font-size="13">&#8226; Question Sequencer</text>
  <text x="80" y="170" font-size="13">&#8226; Direction Review</text>
  <text x="80" y="192" font-size="13">&#8226; Confirmation Module</text>

  <!-- 120 Canonical Intent Layer -->
  <rect x="370" y="80" width="260" height="150" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="105" font-size="15" text-anchor="middle" font-weight="bold">CANONICAL INTENT LAYER</text>
  <text x="500" y="122" font-size="13" text-anchor="middle" font-style="italic">120</text>
  <text x="390" y="148" font-size="13">&#8226; CNI Mapper</text>
  <text x="390" y="170" font-size="13">&#8226; Priority Weights</text>
  <text x="390" y="192" font-size="13">&#8226; Schema Versioning</text>

  <!-- 130 Generation Layer -->
  <rect x="680" y="80" width="260" height="150" fill="none" stroke="black" stroke-width="2"/>
  <text x="810" y="105" font-size="15" text-anchor="middle" font-weight="bold">GENERATION LAYER</text>
  <text x="810" y="122" font-size="13" text-anchor="middle" font-style="italic">130</text>
  <text x="700" y="148" font-size="13">&#8226; Brief Constructor</text>
  <text x="700" y="170" font-size="13">&#8226; Multi-Provider Router</text>
  <text x="700" y="192" font-size="13">&#8226; Quality Adapter</text>

  <!-- Arrows top row: 110 -> 120 -> 130 -->
  <line x1="320" y1="155" x2="365" y2="155" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="155" x2="675" y2="155" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Vertical connector: 130 -> 160 -->
  <line x1="810" y1="230" x2="810" y2="400" stroke="black" stroke-width="2"/>
  <line x1="810" y1="400" x2="810" y2="400" stroke="black" stroke-width="2"/>
  <path d="M810,230 L810,395" stroke="black" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Bottom row boxes -->
  <!-- 160 Reaction Capture -->
  <rect x="680" y="400" width="260" height="150" fill="none" stroke="black" stroke-width="2"/>
  <text x="810" y="425" font-size="15" text-anchor="middle" font-weight="bold">REACTION CAPTURE</text>
  <text x="810" y="442" font-size="13" text-anchor="middle" font-style="italic">160</text>
  <text x="700" y="468" font-size="13">&#8226; Like / Dislike</text>
  <text x="700" y="490" font-size="13">&#8226; Strong Reaction</text>
  <text x="700" y="512" font-size="13">&#8226; Signal Extraction</text>

  <!-- 150 Taste Layer -->
