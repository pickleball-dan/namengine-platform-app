  <text x="500" y="425" font-size="15" text-anchor="middle" font-weight="bold">TASTE LAYER</text>
  <text x="500" y="442" font-size="13" text-anchor="middle" font-style="italic">150</text>
  <text x="390" y="468" font-size="13">&#8226; Taste Profile Constructor</text>
  <text x="390" y="490" font-size="13">&#8226; Taste State</text>
  <text x="390" y="512" font-size="13">&#8226; Exploration Planner</text>

  <!-- 140 Refinement Orchestrator -->
  <rect x="60" y="400" width="260" height="150" fill="none" stroke="black" stroke-width="2"/>
  <text x="190" y="425" font-size="15" text-anchor="middle" font-weight="bold">REFINEMENT</text>
  <text x="190" y="443" font-size="15" text-anchor="middle" font-weight="bold">ORCHESTRATOR</text>
  <text x="190" y="461" font-size="13" text-anchor="middle" font-style="italic">140</text>
  <text x="80" y="485" font-size="13">&#8226; Session Chain</text>
  <text x="80" y="507" font-size="13">&#8226; Round Manager</text>
  <text x="80" y="529" font-size="13">&#8226; Name Exclusion</text>

  <!-- Arrows bottom row: 160 -> 150 -> 140 (right to left) -->
  <line x1="675" y1="475" x2="635" y2="475" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="365" y1="475" x2="325" y2="475" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Storage layer spanning full width -->
  <rect x="60" y="610" width="880" height="60" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="633" font-size="15" text-anchor="middle" font-weight="bold">STORAGE LAYER</text>
  <text x="500" y="649" font-size="12" text-anchor="middle">Session Records &#183; CNI Objects &#183; Reaction Log &#183; Taste State</text>
  <text x="75" y="625" font-size="13" font-style="italic">170</text>

</svg>
