  <!-- Footnote -->
  <text x="115" y="920" font-size="12">&#9733; priority_weights propagates into the downstream consumers shown in FIG. 3A below.</text>

  <!-- Arrow from priority weights row down to callout -->
  <line x1="450" y1="945" x2="450" y2="985" stroke="black" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <!-- Callout box: downstream consumers -->
  <rect x="150" y="985" width="600" height="230" fill="none" stroke="black" stroke-width="2.5"/>
  <text x="450" y="1015" font-size="14" text-anchor="middle" font-weight="bold">DOWNSTREAM CONSUMERS OF priority_weights</text>
  <text x="720" y="1005" font-size="11" font-style="italic">350</text>

  <rect x="175" y="1030" width="550" height="55" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="450" y="1053" font-size="13" text-anchor="middle" font-weight="bold">Quality Adapter Scoring</text>
  <text x="450" y="1073" font-size="12" text-anchor="middle">&#8592; dimension weights adjusted</text>
  <text x="710" y="1053" font-size="11" font-style="italic">352</text>

  <rect x="175" y="1095" width="550" height="55" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="450" y="1118" font-size="13" text-anchor="middle" font-weight="bold">Taste Thesis Builder</text>
  <text x="450" y="1138" font-size="12" text-anchor="middle">&#8592; prompt emphasis adjusted</text>
  <text x="710" y="1118" font-size="11" font-style="italic">354</text>

  <rect x="175" y="1160" width="550" height="55" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="450" y="1183" font-size="13" text-anchor="middle" font-weight="bold">Exploration Planner</text>
  <text x="450" y="1203" font-size="12" text-anchor="middle">&#8592; exploration targets weighted</text>
  <text x="710" y="1183" font-size="11" font-style="italic">356</text>

</svg>
