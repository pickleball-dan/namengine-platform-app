<svg viewBox="0 0 1000 1250" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1250" fill="white"/>
  <text x="500" y="30" font-size="16" text-anchor="middle" font-weight="bold">FIG. 3</text>

  <!-- Outer table boundary -->
