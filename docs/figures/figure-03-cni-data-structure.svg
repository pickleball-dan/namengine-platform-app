    <text x="435" y="652" font-family="monospace">2</text>

    <rect x="100" y="662" width="320" height="30" fill="none" stroke="black" stroke-width="1"/>
    <rect x="420" y="662" width="380" height="30" fill="none" stroke="black" stroke-width="1"/>
