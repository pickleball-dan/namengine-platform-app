<svg viewBox="0 0 900 1500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="1500" fill="white"/>
  <text x="450" y="30" font-size="16" text-anchor="middle" font-weight="bold">FIG. 2</text>

  <!-- 205 Start terminator -->
  <rect x="350" y="55" width="200" height="50" rx="25" ry="25" fill="none" stroke="black" stroke-width="2"/>
  <text x="450" y="85" font-size="14" text-anchor="middle">User Begins Intake</text>
  <text x="565" y="85" font-size="12" font-style="italic">205</text>

  <line x1="450" y1="105" x2="450" y2="140" stroke="black" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 210 Present Question N -->
  <rect x="320" y="140" width="260" height="90" fill="none" stroke="black" stroke-width="2"/>
  <text x="450" y="165" font-size="14" text-anchor="middle" font-weight="bold">Present Question N</text>
  <text x="450" y="183" font-size="12" text-anchor="middle">(one at a time)</text>
  <text x="450" y="201" font-size="12" text-anchor="middle">Required or Optional</text>
  <text x="595" y="165" font-size="12" font-style="italic">210</text>

  <line x1="450" y1="230" x2="450" y2="265" stroke="black" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 215 Decision: User Responds? -->
  <polygon points="450,265 570,335 450,405 330,335" fill="none" stroke="black" stroke-width="2"/>
  <text x="450" y="330" font-size="14" text-anchor="middle" font-weight="bold">User</text>
  <text x="450" y="348" font-size="14" text-anchor="middle" font-weight="bold">Responds?</text>
  <text x="585" y="335" font-size="12" font-style="italic">215</text>

  <!-- Yes branch to 220 -->
  <line x1="450" y1="405" x2="450" y2="450" stroke="black" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="465" y="430" font-size="13">Yes</text>

  <!-- No branch to 225 -->
  <line x1="570" y1="335" x2="700" y2="335" stroke="black" stroke-width="2"/>
  <line x1="700" y1="335" x2="700" y2="450" stroke="black" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="700" y="320" font-size="13" text-anchor="middle">No (optional only)</text>

  <!-- 220 Record Answer -->
  <rect x="320" y="450" width="260" height="90" fill="none" stroke="black" stroke-width="2"/>
  <text x="450" y="480" font-size="14" text-anchor="middle" font-weight="bold">Record Answer to</text>
  <text x="450" y="498" font-size="14" text-anchor="middle" font-weight="bold">Direction Profile</text>
  <text x="595" y="480" font-size="12" font-style="italic">220</text>

  <!-- 225 Skip -->
  <rect x="580" y="450" width="240" height="90" fill="none" stroke="black" stroke-width="2"/>
  <text x="700" y="480" font-size="14" text-anchor="middle" font-weight="bold">Skip</text>
  <text x="700" y="498" font-size="12" text-anchor="middle">(no answer recorded)</text>
  <text x="815" y="480" font-size="12" font-style="italic">225</text>

  <!-- Both merge down to 230 -->
  <line x1="450" y1="540" x2="450" y2="575" stroke="black" stroke-width="2"/>
  <line x1="700" y1="540" x2="700" y2="600" stroke="black" stroke-width="2"/>
  <line x1="700" y1="600" x2="450" y2="600" stroke="black" stroke-width="2" marker-end="url(#arrow2)"/>

  <line x1="450" y1="600" x2="450" y2="635" stroke="black" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 230 Decision: More Questions? -->
  <polygon points="450,635 580,710 450,785 320,710" fill="none" stroke="black" stroke-width="2"/>
  <text x="450" y="705" font-size="14" text-anchor="middle" font-weight="bold">More</text>
  <text x="450" y="723" font-size="14" text-anchor="middle" font-weight="bold">Questions?</text>
  <text x="595" y="710" font-size="12" font-style="italic">230</text>

  <!-- Yes loop back to 210 -->
  <line x1="320" y1="710" x2="120" y2="710" stroke="black" stroke-width="2"/>
  <line x1="120" y1="710" x2="120" y2="185" stroke="black" stroke-width="2"/>
  <line x1="120" y1="185" x2="315" y2="185" stroke="black" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="150" y="700" font-size="13">Yes</text>

  <!-- No branch down to 240 -->
  <line x1="450" y1="785" x2="450" y2="820" stroke="black" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="465" y="810" font-size="13">No</text>

  <!-- 240 Direction Review -->
  <rect x="290" y="820" width="320" height="130" fill="none" stroke="black" stroke-width="2"/>
  <text x="450" y="850" font-size="15" text-anchor="middle" font-weight="bold">DIRECTION REVIEW</text>
  <text x="450" y="872" font-size="13" text-anchor="middle">Show all answers</text>
  <text x="450" y="892" font-size="13" text-anchor="middle">User may edit any answer</text>
  <text x="450" y="912" font-size="13" text-anchor="middle">Edit &#8594; return to question,</text>
  <text x="450" y="930" font-size="13" text-anchor="middle">then back to review</text>
  <text x="635" y="850" font-size="12" font-style="italic">240</text>

  <!-- Edit-from-review loop (return arrow) -->
  <line x1="290" y1="885" x2="180" y2="885" stroke="black" stroke-width="2"/>
  <line x1="180" y1="885" x2="180" y2="185" stroke="black" stroke-width="2"/>
  <line x1="180" y1="185" x2="315" y2="185" stroke="black" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="185" y="500" font-size="13" text-anchor="middle" transform="rotate(-90 185 500)">Edit selected answer</text>

  <line x1="450" y1="950" x2="450" y2="985" stroke="black" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="465" y="975" font-size="13">Confirmed</text>

  <!-- 250 CNI Mapper -->
  <rect x="290" y="985" width="320" height="110" fill="none" stroke="black" stroke-width="2"/>
  <text x="450" y="1015" font-size="15" text-anchor="middle" font-weight="bold">CNI MAPPER</text>
  <text x="450" y="1037" font-size="13" text-anchor="middle">Normalize to CNI object</text>
  <text x="450" y="1057" font-size="13" text-anchor="middle">with priority_weights</text>
  <text x="635" y="1015" font-size="12" font-style="italic">250</text>
  <text x="450" y="1077" font-size="11" text-anchor="middle" font-style="italic">(see FIG. 1, element 120)</text>

  <line x1="450" y1="1095" x2="450" y2="1130" stroke="black" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- End terminator -->
  <rect x="330" y="1130" width="240" height="55" rx="27" ry="27" fill="none" stroke="black" stroke-width="2"/>
  <text x="450" y="1163" font-size="14" text-anchor="middle">To Naming Brief</text>
  <text x="450" y="1180" font-size="11" text-anchor="middle" font-style="italic">(see FIG. 1, element 130)</text>

</svg>
