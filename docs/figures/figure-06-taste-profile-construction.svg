<svg viewBox="0 0 1050 1350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1050" height="1350" fill="white"/>
  <text x="525" y="30" font-size="16" text-anchor="middle" font-weight="bold">FIG. 6</text>

  <!-- 600 Input terminator -->
  <rect x="255" y="55" width="540" height="55" rx="27" ry="27" fill="none" stroke="black" stroke-width="2"/>
  <text x="525" y="87" font-size="13" text-anchor="middle">Session Chain: Round 1 reactions + Round 2 reactions + ...</text>
  <text x="800" y="87" font-size="12" font-style="italic">600</text>

  <line x1="525" y1="110" x2="525" y2="145" stroke="black" stroke-width="2" marker-end="url(#arrow6)"/>

  <!-- 610 Taste Profile Constructor -->
  <rect x="305" y="145" width="440" height="70" fill="none" stroke="black" stroke-width="2.5"/>
  <text x="525" y="187" font-size="16" text-anchor="middle" font-weight="bold">TASTE PROFILE CONSTRUCTOR</text>
  <text x="730" y="167" font-size="12" font-style="italic">610</text>

  <!-- fan-out to three parallel extractors -->
  <line x1="525" y1="215" x2="525" y2="245" stroke="black" stroke-width="2"/>
  <line x1="175" y1="245" x2="875" y2="245" stroke="black" stroke-width="2"/>
  <line x1="175" y1="245" x2="175" y2="280" stroke="black" stroke-width="2" marker-end="url(#arrow6)"/>
  <line x1="525" y1="245" x2="525" y2="280" stroke="black" stroke-width="2" marker-end="url(#arrow6)"/>
  <line x1="875" y1="245" x2="875" y2="280" stroke="black" stroke-width="2" marker-end="url(#arrow6)"/>

  <!-- 620 Phonetic Signal Extractor -->
  <rect x="40" y="280" width="270" height="300" fill="none" stroke="black" stroke-width="2"/>
  <text x="175" y="308" font-size="14" text-anchor="middle" font-weight="bold">PHONETIC SIGNAL</text>
  <text x="175" y="326" font-size="14" text-anchor="middle" font-weight="bold">EXTRACTOR</text>
  <text x="290" y="308" font-size="12" font-style="italic">620</text>
  <text x="60" y="355" font-size="12" font-weight="bold">Liked names:</text>
  <text x="70" y="375" font-size="12">&#8226; onset</text>
  <text x="70" y="393" font-size="12">&#8226; nucleus</text>
  <text x="70" y="411" font-size="12">&#8226; coda</text>
  <text x="70" y="429" font-size="12">&#8226; syllables</text>
  <text x="60" y="465" font-size="12" font-weight="bold">Disliked:</text>
  <text x="70" y="485" font-size="12">&#8226; patterns to avoid</text>

  <!-- 630 Territory & Rationale Aggregator -->
  <rect x="390" y="280" width="270" height="300" fill="none" stroke="black" stroke-width="2"/>
  <text x="525" y="308" font-size="14" text-anchor="middle" font-weight="bold">TERRITORY &amp; RATIONALE</text>
  <text x="525" y="326" font-size="14" text-anchor="middle" font-weight="bold">AGGREGATOR</text>
  <text x="640" y="308" font-size="12" font-style="italic">630</text>
  <text x="410" y="355" font-size="12" font-weight="bold">Liked territories:</text>
  <text x="420" y="375" font-size="12">&#8226; nature</text>
  <text x="420" y="393" font-size="12">&#8226; vintage</text>
  <text x="420" y="411" font-size="12">&#8226; cultural</text>
  <text x="410" y="447" font-size="12" font-weight="bold">Rejected territories:</text>
  <text x="420" y="467" font-size="12">&#8226; lanes to exclude</text>

  <!-- 640 Style Scoring -->
  <rect x="740" y="280" width="270" height="300" fill="none" stroke="black" stroke-width="2"/>
  <text x="875" y="308" font-size="14" text-anchor="middle" font-weight="bold">STYLE SCORING</text>
  <text x="990" y="308" font-size="12" font-style="italic">640</text>
  <text x="760" y="340" font-size="12">Tag frequency count from</text>
  <text x="760" y="358" font-size="12">liked reactions</text>
  <text x="760" y="392" font-size="12" font-weight="bold">Style scores:</text>
  <text x="770" y="412" font-size="12" font-family="monospace">classic: 0.72</text>
  <text x="770" y="430" font-size="12" font-family="monospace">modern: 0.18</text>
  <text x="770" y="448" font-size="12" font-family="monospace">nature: 0.54</text>
  <text x="770" y="466" font-size="12" font-family="monospace">...</text>

  <!-- converge to TasteProfile -->
  <line x1="175" y1="580" x2="175" y2="615" stroke="black" stroke-width="2"/>
  <line x1="525" y1="580" x2="525" y2="615" stroke="black" stroke-width="2"/>
  <line x1="875" y1="580" x2="875" y2="615" stroke="black" stroke-width="2"/>
  <line x1="175" y1="615" x2="875" y2="615" stroke="black" stroke-width="2"/>
  <line x1="525" y1="615" x2="525" y2="650" stroke="black" stroke-width="2" marker-end="url(#arrow6)"/>

  <!-- 650 TasteProfile -->
  <rect x="260" y="650" width="530" height="270" fill="none" stroke="black" stroke-width="2.5"/>
  <text x="525" y="680" font-size="16" text-anchor="middle" font-weight="bold">TASTE PROFILE</text>
  <text x="765" y="680" font-size="12" font-style="italic">650</text>
  <g font-size="13" font-family="monospace">
    <text x="285" y="710">liked_phonetics: [patterns]</text>
    <text x="285" y="735">disliked_phonetics: [patterns]</text>
    <text x="285" y="760">liked_territories: [tags]</text>
    <text x="285" y="785">rejected_lanes: [tags]</text>
    <text x="285" y="810">style_scores: {tag: score}</text>
    <text x="285" y="835">liked_examples: [name list]</text>
    <text x="285" y="860">rejected_examples: [name list]</text>
  </g>
  <text x="525" y="905" font-size="10" text-anchor="middle" font-style="italic">(serialized and stored per FIG. 1, element 170)</text>

  <!-- fan-out to two downstream consumers -->
  <line x1="525" y1="920" x2="525" y2="955" stroke="black" stroke-width="2"/>
  <line x1="330" y1="955" x2="720" y2="955" stroke="black" stroke-width="2"/>
  <line x1="330" y1="955" x2="330" y2="990" stroke="black" stroke-width="2" marker-end="url(#arrow6)"/>
  <line x1="720" y1="955" x2="720" y2="990" stroke="black" stroke-width="2" marker-end="url(#arrow6)"/>

  <!-- 660 Brief Constructor -->
  <rect x="180" y="990" width="300" height="110" fill="none" stroke="black" stroke-width="2"/>
  <text x="330" y="1025" font-size="14" text-anchor="middle" font-weight="bold">Brief Constructor</text>
  <text x="330" y="1047" font-size="12" text-anchor="middle">(prompt enrichment)</text>
  <text x="465" y="1025" font-size="12" font-style="italic">660</text>
  <text x="330" y="1080" font-size="10" text-anchor="middle" font-style="italic">(see FIG. 1, element 130)</text>

  <!-- 670 Taste State -->
  <rect x="570" y="990" width="300" height="110" fill="none" stroke="black" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="720" y="1020" font-size="14" text-anchor="middle" font-weight="bold">Taste State</text>
  <text x="720" y="1040" font-size="12" text-anchor="middle">(advanced embodiment</text>
  <text x="720" y="1058" font-size="12" text-anchor="middle">&#8212; see FIG. 9)</text>
  <text x="855" y="1020" font-size="12" font-style="italic">670</text>

</svg>
