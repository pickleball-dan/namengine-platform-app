<svg viewBox="0 0 1000 1450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1450" fill="white"/>
  <text x="500" y="30" font-size="16" text-anchor="middle" font-weight="bold">FIG. 4</text>

  <!-- 400 Input terminator -->
  <rect x="350" y="55" width="300" height="55" rx="27" ry="27" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="87" font-size="14" text-anchor="middle">NamingBrief + CNI</text>
  <text x="665" y="87" font-size="12" font-style="italic">400</text>

  <line x1="500" y1="110" x2="500" y2="145" stroke="black" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- 410 Generation Router -->
  <rect x="320" y="145" width="360" height="95" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="175" font-size="15" text-anchor="middle" font-weight="bold">GENERATION ROUTER</text>
  <text x="500" y="196" font-size="12" text-anchor="middle">(dispatch strategy:</text>
  <text x="500" y="214" font-size="12" text-anchor="middle">parallel or sequential)</text>
  <text x="695" y="175" font-size="12" font-style="italic">410</text>
  <text x="500" y="232" font-size="10" text-anchor="middle" font-style="italic">(see FIG. 1, element 130)</text>

  <!-- Parallel dispatch: two simultaneous arrows down -->
  <line x1="420" y1="240" x2="420" y2="290" stroke="black" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="580" y1="240" x2="580" y2="290" stroke="black" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="800" y1="240" x2="800" y2="290" stroke="black" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow4)"/>
  <line x1="500" y1="240" x2="420" y2="240" stroke="black" stroke-width="2"/>
  <line x1="500" y1="240" x2="580" y2="240" stroke="black" stroke-width="2"/>
  <line x1="500" y1="240" x2="800" y2="240" stroke="black" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- 420 Provider A -->
  <rect x="320" y="290" width="200" height="80" fill="none" stroke="black" stroke-width="2"/>
  <text x="420" y="320" font-size="14" text-anchor="middle" font-weight="bold">Provider A</text>
  <text x="420" y="340" font-size="12" text-anchor="middle">(e.g., GPT)</text>
  <text x="505" y="320" font-size="12" font-style="italic">420</text>

  <!-- 422 Provider B -->
  <rect x="530" y="290" width="200" height="80" fill="none" stroke="black" stroke-width="2"/>
  <text x="630" y="320" font-size="14" text-anchor="middle" font-weight="bold">Provider B</text>
  <text x="630" y="340" font-size="12" text-anchor="middle">(e.g., Claude)</text>
  <text x="715" y="320" font-size="12" font-style="italic">422</text>

  <!-- 424 additional providers (dashed to indicate optional/extensible) -->
  <rect x="740" y="290" width="200" height="80" fill="none" stroke="black" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="840" y="320" font-size="13" text-anchor="middle" font-weight="bold">(additional</text>
  <text x="840" y="338" font-size="13" text-anchor="middle" font-weight="bold">providers)</text>
  <text x="925" y="320" font-size="12" font-style="italic">424</text>

  <!-- Converge down to result collection -->
  <line x1="420" y1="370" x2="420" y2="410" stroke="black" stroke-width="2"/>
  <line x1="630" y1="370" x2="630" y2="410" stroke="black" stroke-width="2"/>
  <line x1="840" y1="370" x2="840" y2="410" stroke="black" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="420" y1="410" x2="840" y2="410" stroke="black" stroke-width="2"/>
  <line x1="630" y1="410" x2="630" y2="440" stroke="black" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- 430 Result Collection -->
  <rect x="380" y="440" width="500" height="90" fill="none" stroke="black" stroke-width="2"/>
  <text x="630" y="470" font-size="15" text-anchor="middle" font-weight="bold">RESULT COLLECTION</text>
  <text x="630" y="492" font-size="12" text-anchor="middle">Combine all candidates from all providers</text>
  <text x="630" y="510" font-size="12" text-anchor="middle">into GenerationCandidate objects</text>
  <text x="855" y="470" font-size="12" font-style="italic">430</text>

  <line x1="630" y1="530" x2="630" y2="565" stroke="black" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- 440 Quality Adapter Scoring -->
  <rect x="380" y="565" width="500" height="120" fill="none" stroke="black" stroke-width="2"/>
  <text x="630" y="595" font-size="15" text-anchor="middle" font-weight="bold">QUALITY ADAPTER SCORING</text>
  <text x="630" y="618" font-size="12" text-anchor="middle">Score each candidate on vertical-specific</text>
  <text x="630" y="636" font-size="12" text-anchor="middle">dimensions, weighted by priority_weights</text>
  <text x="630" y="654" font-size="12" text-anchor="middle">and taste profile</text>
  <text x="855" y="595" font-size="12" font-style="italic">440</text>
  <text x="630" y="675" font-size="10" text-anchor="middle" font-style="italic">(see FIG. 3, elements 330/350)</text>

  <line x1="630" y1="685" x2="630" y2="720" stroke="black" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- 450 Decision: Sufficient high-quality results? -->
  <polygon points="630,720 780,810 630,900 480,810" fill="none" stroke="black" stroke-width="2"/>
  <text x="630" y="795" font-size="13" text-anchor="middle" font-weight="bold">Sufficient</text>
  <text x="630" y="813" font-size="13" text-anchor="middle" font-weight="bold">high-quality</text>
  <text x="630" y="831" font-size="13" text-anchor="middle" font-weight="bold">results?</text>
  <text x="795" y="810" font-size="12" font-style="italic">450</text>

  <!-- Yes branch -->
  <line x1="630" y1="900" x2="630" y2="940" stroke="black" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="645" y="925" font-size="13">Yes</text>

  <!-- No branch -->
  <line x1="480" y1="810" x2="250" y2="810" stroke="black" stroke-width="2"/>
  <line x1="250" y1="810" x2="250" y2="940" stroke="black" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="360" y="795" font-size="13">No</text>

  <!-- 460 Return top-N candidates -->
  <rect x="500" y="940" width="260" height="90" fill="none" stroke="black" stroke-width="2"/>
  <text x="630" y="972" font-size="14" text-anchor="middle" font-weight="bold">Return top-N</text>
  <text x="630" y="992" font-size="14" text-anchor="middle" font-weight="bold">candidates to user</text>
  <text x="745" y="972" font-size="12" font-style="italic">460</text>

  <!-- 470 Fallback -->
  <rect x="80" y="940" width="340" height="160" fill="none" stroke="black" stroke-width="2"/>
  <text x="250" y="970" font-size="14" text-anchor="middle" font-weight="bold">FALLBACK</text>
  <text x="100" y="995" font-size="12">&#8226; Retry with adjusted prompt</text>
  <text x="100" y="1017" font-size="12">&#8226; Add provider</text>
  <text x="100" y="1039" font-size="12">&#8226; Relax quality threshold</text>
  <text x="100" y="1061" font-size="12">&#8226; Return best available</text>
  <text x="395" y="970" font-size="12" font-style="italic">470</text>

  <!-- Fallback loops back into Generation Router for retry -->
  <line x1="250" y1="940" x2="250" y2="900" stroke="black" stroke-width="2"/>
  <line x1="250" y1="900" x2="150" y2="900" stroke="black" stroke-width="2"/>
  <line x1="150" y1="900" x2="150" y2="192" stroke="black" stroke-width="2"/>
  <line x1="150" y1="192" x2="315" y2="192" stroke="black" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="130" y="600" font-size="12" text-anchor="middle" transform="rotate(-90 130 600)">Retry / adjusted dispatch</text>

  <!-- Fallback can also converge to returning best available -->
  <line x1="250" y1="1100" x2="250" y2="1130" stroke="black" stroke-width="2"/>
  <line x1="250" y1="1130" x2="630" y2="1130" stroke="black" stroke-width="2"/>
  <line x1="630" y1="1130" x2="630" y2="1030" stroke="black" stroke-width="2" marker-end="url(#arrow4)" stroke-dasharray="6,4"/>
  <text x="440" y="1120" font-size="11" text-anchor="middle" font-style="italic">(return best available)</text>

  <!-- End terminator -->
  <line x1="630" y1="1030" x2="630" y2="1080" stroke="black" stroke-width="2" marker-end="url(#arrow4)"/>
  <rect x="470" y="1080" width="320" height="55" rx="27" ry="27" fill="none" stroke="black" stroke-width="2"/>
  <text x="630" y="1113" font-size="14" text-anchor="middle">To Reaction Capture</text>
  <text x="630" y="1130" font-size="10" text-anchor="middle" font-style="italic">(see FIG. 1, element 160)</text>

</svg>
