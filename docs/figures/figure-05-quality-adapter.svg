<svg viewBox="0 0 1000 1400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1400" fill="white"/>
  <text x="500" y="30" font-size="16" text-anchor="middle" font-weight="bold">FIG. 5</text>

  <!-- Outer boundary: Quality Adapter -->
  <rect x="70" y="55" width="860" height="1290" fill="none" stroke="black" stroke-width="2.5"/>
  <text x="500" y="82" font-size="15" text-anchor="middle" font-weight="bold">QUALITY ADAPTER (Baby vertical example)</text>
  <text x="850" y="70" font-size="12" font-style="italic">500</text>
  <text x="500" y="100" font-size="11" text-anchor="middle" font-style="italic">Each vertical (Baby / Pet / Business) registers its own adapter instance with different dimensions</text>

  <!-- Input terminator -->
  <rect x="270" y="115" width="460" height="55" rx="27" ry="27" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="140" font-size="13" text-anchor="middle">INPUT: Candidate Name +</text>
  <text x="500" y="158" font-size="13" text-anchor="middle">NamingBrief + TasteProfile</text>

  <line x1="500" y1="170" x2="500" y2="205" stroke="black" stroke-width="2" marker-end="url(#arrow5)"/>

  <!-- 510 Taste Thesis Builder -->
  <rect x="130" y="205" width="740" height="230" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="233" font-size="15" text-anchor="middle" font-weight="bold">TASTE THESIS BUILDER</text>
  <text x="820" y="233" font-size="12" font-style="italic">510</text>
  <text x="500" y="255" font-size="12" text-anchor="middle">Reads priority_weights + taste profile</text>
  <text x="500" y="273" font-size="12" text-anchor="middle">Constructs AI scoring prompt directives:</text>
  <text x="160" y="300" font-size="12">&#8226; "Prioritize classic style (weight: 0.6)"</text>
  <text x="160" y="322" font-size="12">&#8226; "Soft phonetics are important (weight: 0.3)"</text>
  <text x="160" y="344" font-size="12">&#8226; Positive examples: [liked names from profile]</text>
  <text x="160" y="366" font-size="12">&#8226; Negative examples: [disliked names from profile]</text>
  <text x="500" y="410" font-size="10" text-anchor="middle" font-style="italic">(inputs: FIG. 3 element 330 priority_weights; FIG. 1 element 150 taste layer)</text>

  <line x1="500" y1="435" x2="500" y2="470" stroke="black" stroke-width="2" marker-end="url(#arrow5)"/>

  <!-- 520 Scoring Dimensions table -->
  <rect x="130" y="470" width="740" height="420" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="498" font-size="15" text-anchor="middle" font-weight="bold">SCORING DIMENSIONS (Baby)</text>
  <text x="820" y="498" font-size="12" font-style="italic">520</text>

  <!-- table -->
  <g font-size="13">
    <!-- header row -->
    <rect x="160" y="515" width="300" height="35" fill="none" stroke="black" stroke-width="1.5"/>
    <rect x="460" y="515" width="150" height="35" fill="none" stroke="black" stroke-width="1.5"/>
    <rect x="610" y="515" width="230" height="35" fill="none" stroke="black" stroke-width="1.5"/>
    <text x="310" y="538" text-anchor="middle" font-weight="bold">Dimension</text>
    <text x="535" y="538" text-anchor="middle" font-weight="bold">Base Weight</text>
    <text x="725" y="538" text-anchor="middle" font-weight="bold">Priority-Adjusted</text>

    <!-- rows -->
    <rect x="160" y="550" width="300" height="34" fill="none" stroke="black" stroke-width="1"/>
    <rect x="460" y="550" width="150" height="34" fill="none" stroke="black" stroke-width="1"/>
    <rect x="610" y="550" width="230" height="34" fill="none" stroke="black" stroke-width="1"/>
    <text x="175" y="572">Style alignment</text>
    <text x="535" y="572" text-anchor="middle">0.30</text>
    <text x="725" y="572" text-anchor="middle" font-family="monospace">&#215; priority_weight</text>

    <rect x="160" y="584" width="300" height="34" fill="none" stroke="black" stroke-width="1"/>
    <rect x="460" y="584" width="150" height="34" fill="none" stroke="black" stroke-width="1"/>
    <rect x="610" y="584" width="230" height="34" fill="none" stroke="black" stroke-width="1"/>
    <text x="175" y="606">Phonetic fit</text>
    <text x="535" y="606" text-anchor="middle">0.25</text>
    <text x="725" y="606" text-anchor="middle" font-family="monospace">&#215; priority_weight</text>

    <rect x="160" y="618" width="300" height="34" fill="none" stroke="black" stroke-width="1"/>
    <rect x="460" y="618" width="150" height="34" fill="none" stroke="black" stroke-width="1"/>
    <rect x="610" y="618" width="230" height="34" fill="none" stroke="black" stroke-width="1"/>
    <text x="175" y="640">Distinctiveness</text>
    <text x="535" y="640" text-anchor="middle">0.20</text>
    <text x="725" y="640" text-anchor="middle" font-family="monospace">&#215; priority_weight</text>

    <rect x="160" y="652" width="300" height="34" fill="none" stroke="black" stroke-width="1"/>
    <rect x="460" y="652" width="150" height="34" fill="none" stroke="black" stroke-width="1"/>
    <rect x="610" y="652" width="230" height="34" fill="none" stroke="black" stroke-width="1"/>
    <text x="175" y="674">Cultural fit</text>
    <text x="535" y="674" text-anchor="middle">0.15</text>
    <text x="725" y="674" text-anchor="middle" font-family="monospace">&#215; priority_weight</text>

    <rect x="160" y="686" width="300" height="34" fill="none" stroke="black" stroke-width="1"/>
    <rect x="460" y="686" width="150" height="34" fill="none" stroke="black" stroke-width="1"/>
    <rect x="610" y="686" width="230" height="34" fill="none" stroke="black" stroke-width="1"/>
    <text x="175" y="708">Emotional quality</text>
    <text x="535" y="708" text-anchor="middle">0.10</text>
    <text x="725" y="708" text-anchor="middle" font-family="monospace">&#215; priority_weight</text>

    <!-- total row, bold border -->
    <rect x="160" y="720" width="300" height="34" fill="none" stroke="black" stroke-width="2"/>
    <rect x="460" y="720" width="150" height="34" fill="none" stroke="black" stroke-width="2"/>
    <rect x="610" y="720" width="230" height="34" fill="none" stroke="black" stroke-width="2"/>
    <text x="175" y="742" font-weight="bold">Total</text>
    <text x="535" y="742" text-anchor="middle" font-weight="bold">1.00</text>
  </g>

  <text x="500" y="785" font-size="11" text-anchor="middle" font-style="italic">Dimension set, base weights, and count are vertical-specific (Pet/Business adapters differ)</text>
  <text x="500" y="805" font-size="12" text-anchor="middle" font-weight="bold">&#9733; Weights are dynamically adjusted by priority_weights at scoring time (not fixed)</text>

  <line x1="500" y1="890" x2="500" y2="925" stroke="black" stroke-width="2" marker-end="url(#arrow5)"/>

  <!-- 530 Composite Score + Explanation -->
  <rect x="130" y="925" width="740" height="150" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="955" font-size="15" text-anchor="middle" font-weight="bold">COMPOSITE SCORE + EXPLANATION</text>
  <text x="820" y="955" font-size="12" font-style="italic">530</text>
  <text x="160" y="982" font-size="12">&#8226; score: 0.0&#8211;1.0 float</text>
  <text x="160" y="1004" font-size="12">&#8226; rationale: per-dimension breakdown</text>
  <text x="160" y="1026" font-size="12">&#8226; improvement_hooks: suggestions for next round</text>
  <text x="500" y="1055" font-size="10" text-anchor="middle" font-style="italic">(optional evaluate_attributes / improve_explanations hooks)</text>

  <line x1="500" y1="1075" x2="500" y2="1110" stroke="black" stroke-width="2" marker-end="url(#arrow5)"/>

  <!-- Output terminator -->
  <rect x="220" y="1110" width="560" height="55" rx="27" ry="27" fill="none" stroke="black" stroke-width="2"/>
  <text x="500" y="1143" font-size="13" text-anchor="middle">OUTPUT: Ranked candidates with scores and rationales</text>

</svg>
